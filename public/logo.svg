<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="tickGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="25%" stop-color="#15803d" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0" />
      <stop offset="100%" stop-color="#bef264" stop-opacity="0.9" />
    </linearGradient>
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(10, 5)" filter="url(#logoShadow)">
    <g transform="rotate(-38 85 85)">
      <path d="M 36 18 H 134 A 8 8 0 0 1 142 26 V 50 C 137 50, 133 54, 133 60 C 133 66, 137 70, 142 70 V 85 C 137 85, 133 89, 133 95 C 133 101, 137 105, 142 105 V 128 A 8 8 0 0 1 134 136 H 36 A 8 8 0 0 1 28 128 V 105 C 33 105, 37 101, 37 95 C 37 89, 33 85, 28 85 V 70 C 33 70, 37 66, 37 60 C 37 54, 33 50, 28 50 V 26 A 8 8 0 0 1 36 18 Z" fill="url(#ticketGrad)" stroke="#166534" stroke-width="1.5" />
      <path d="M 40 28 H 130 V 126 H 40 Z" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.8" stroke-dasharray="4 3" fill="none" />
      <rect x="52" y="38" width="66" height="48" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="#15803d" stroke-width="1" stroke-opacity="0.4" />
      <!-- Crowd silhouettes -->
      <circle cx="65" cy="54" r="3.2" fill="#166534" />
      <path d="M 59 72 C 59 64, 71 64, 71 72 Z" fill="#166534" />
      <path d="M 59 65 Q 55 57 56 52 Q 58 52 61 61" stroke="#166534" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 67 63 Q 65 56 66 51 Q 68 51 68 60" stroke="#166534" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <!-- Center person jumping -->
      <circle cx="85" cy="50" r="3.8" fill="#15803d" />
      <path d="M 78 72 C 78 62, 92 62, 92 72 Z" fill="#15803d" />
      <path d="M 78 61 Q 72 50 70 43" stroke="#15803d" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 92 61 Q 98 50 100 43" stroke="#15803d" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <!-- Right person -->
      <circle cx="104" cy="54" r="3.2" fill="#166534" />
      <path d="M 98 72 C 98 64, 110 64, 110 72 Z" fill="#166534" />
      <path d="M 103 63 Q 103 54 106 50" stroke="#166534" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 107 65 Q 112 58 114 53" stroke="#166534" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <!-- Confetti -->
      <circle cx="61" cy="43" r="1.2" fill="#22c55e" />
      <circle cx="72" cy="40" r="1" fill="#16a34a" />
      <circle cx="98" cy="39" r="1.2" fill="#15803d" />
      <circle cx="110" cy="42" r="1" fill="#22c55e" />
    </g>

    <!-- CHECKMARK (TICK) -->
    <path d="M 44 95 C 51 106, 61 126, 73 140 C 77 145, 83 146, 88 141 C 107 122, 139 74, 175 23 C 178 19, 174 15, 170 17 C 136 34, 103 72, 85 102 C 77 93, 65 84, 57 77 C 52 73, 41 85, 44 95 Z" fill="#ffffff" />
    <path d="M 48 95 C 55 105, 64 123, 75 136 C 78 140, 82 141, 85 137 C 103 118, 134 72, 169 23 C 167 21, 164 22, 160 25 C 130 42, 99 78, 83 106 C 76 98, 66 90, 59 84 C 55 81, 46 90, 48 95 Z" fill="url(#tickGrad)" />
    <path d="M 83 106 C 99 78, 130 42, 160 25 C 164 22, 167 21, 169 23 C 166 26, 136 69, 107 112 C 96 128, 85 137, 85 137 C 82 141, 78 140, 75 136 C 78 129, 81 117, 83 106 Z" fill="url(#highlightGrad)" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(205, 20)">
    <text x="0" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="0.5px" fill="#1b7a3e">
      TICK TICKET
    </text>
    <text x="3" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="4.5px" fill="#529c32">
      VÉ SỰ KIỆN TRỰC TUYẾN
    </text>
  </g>
</svg>